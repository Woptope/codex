<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continue Button Companion</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <strong>Continue Button Companion</strong>
          <span>Codex App Server</span>
        </div>
        <div class="connection">
          <label class="field">
            <span>Server URL</span>
            <input id="server-url" autocomplete="off" spellcheck="false" />
          </label>
          <button id="connect" type="button">Connect</button>
          <span id="connection-status" class="status-pill" data-state="none">Disconnected</span>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar">
          <div class="session-actions">
            <div class="inline-action">
              <label class="field">
                <span>CWD</span>
                <input id="cwd" autocomplete="off" spellcheck="false" />
              </label>
              <button id="start-session" type="button">Start</button>
            </div>
            <div class="inline-action">
              <label class="field">
                <span>Session ID</span>
                <input id="resume-session-id" autocomplete="off" spellcheck="false" />
              </label>
              <button id="resume-session" type="button">Resume</button>
            </div>
            <button id="refresh-sessions" type="button">Refresh</button>
          </div>

          <h2 class="section-title">Sessions</h2>
          <div id="session-list" class="session-list"></div>
        </aside>

        <section class="main">
          <div class="selected-panel">
            <div>
              <h1 id="selected-title" class="selected-title">No session selected</h1>
              <div id="selected-meta" class="selected-meta"></div>
            </div>
            <div class="continue-stack">
              <span id="selected-status" class="status-pill" data-state="none">None</span>
              <button id="continue-button" class="primary continue-button" type="button" disabled>
                Continue
              </button>
              <div id="activity" class="activity" data-state="muted"></div>
            </div>
          </div>
          <div class="empty-state"></div>
        </section>
      </main>
    </div>

    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
